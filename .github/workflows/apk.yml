name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip project
        run: |
          ls -la
          ZIP=$(ls *.zip | sort | tail -n 1)
          echo "Using zip: $ZIP"
          mkdir -p app
          unzip -o -q "$ZIP" -d app
          if [ ! -f app/package.json ]; then
            SUB=$(find app -maxdepth 2 -name package.json | head -n 1 | xargs dirname)
            mkdir -p app_fix
            cp -r "$SUB"/. app_fix/
            rm -rf app
            mv app_fix app
          fi
          ls -la app app/www

      - name: Offline libraries (best effort)
        working-directory: app
        run: python3 prepare.py

      - name: Install packages
        working-directory: app
        run: npm install

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          RES=android/app/src/main/res
          cp -r android-res/. $RES/
          find $RES -name 'splash.png' -exec cp splash-solid.png {} \;
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>#' $RES/values/styles.xml
          npx cap sync android
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ShalaSathi-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
